<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1A237E;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #9FA8DA;
            line-height: 1.6;
            max-width: 300px;
        }
        .divider {
            width: 50px;
            height: 3px;
            background: #3949AB;
            border-radius: 2px;
            margin: 18px auto;
        }
        .hint {
            font-size: 12px;
            color: #7986CB;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <div class="title">You Are Offline</div>
    <div class="divider"></div>
    <div class="subtitle">No internet connection detected. Please check your Wi-Fi or mobile data and try again.</div>
    <div class="hint">Learning Portal &mdash; Offline Mode</div>
</body>
</html>
